# Chains TCG gateway — single public entry point (host port 8080).
#
#   /api/*       → profile service (REST: profiles, decks, matches, leaderboard)
#   /games/*     → game service (boardgame.io lobby REST)
#   /socket.io/* → game service (websocket — boardgame.io multiplayer transport)
#
# CORS is handled by the upstream services themselves; nginx adds no CORS
# headers so browsers never see duplicates.

events {}

http {
  # Websocket-aware Connection header: "upgrade" when the client asks for an
  # upgrade, "close" otherwise.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # Profile service serves its routes under /api/* itself — no path rewrite.
    location /api/ {
      proxy_pass http://profile:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # boardgame.io lobby REST (list games, create/join/leave matches).
    location /games/ {
      proxy_pass http://game:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # boardgame.io realtime transport — websocket upgrade is mandatory here.
    location /socket.io/ {
      proxy_pass http://game:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    location / {
      default_type application/json;
      return 404 '{"error":"not found"}';
    }
  }
}
