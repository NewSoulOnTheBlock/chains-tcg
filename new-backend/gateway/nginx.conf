# Chains TCG gateway — the only thing exposed to a browser.
#
# This file is mounted as /etc/nginx/templates/nginx.conf.template and rendered
# to /etc/nginx/nginx.conf by the stock nginx entrypoint. The only substitution
# is ${ALLOWED_ORIGINS_REGEX}, which docker-entrypoint.d/05-cors-allowlist.envsh
# derives from the comma-separated ALLOWED_ORIGINS environment variable.
# nginx's own $variables are untouched — envsubst is given an explicit list.
#
# ---------------------------------------------------------------------------
# CORS OWNERSHIP: this file is the ONLY layer that emits CORS headers.
# Services must never set Access-Control-* — two layers would produce duplicate
# Access-Control-Allow-Origin values, which browsers reject outright, and the
# allowlist would have two sources of truth. `packages/shared/src/service.ts`
# deliberately installs no CORS middleware.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    # API-first: anything without an explicit type is JSON, not HTML.
    default_type  application/json;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------- limits
    # M-1: the old Koa server had no body cap at all, so any client could post
    # an arbitrarily large JSON document straight into the parser.
    client_max_body_size    256k;
    client_body_buffer_size 32k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_header_timeout   10s;
    client_body_timeout     10s;
    send_timeout            30s;

    # --------------------------------------------------------------- real ip
    # Every rate-limit zone below keys on $binary_remote_addr. Behind a reverse
    # proxy that is the PROXY's address, identical for every client on earth —
    # which silently turns all of them into ONE shared bucket: 5 auth req/min
    # and 64 concurrent connections for the entire internet, and a trivial DoS.
    #
    # So take the client address from X-Forwarded-For, but only when the peer is
    # a private/loopback address. Nothing but the TLS terminator can reach this
    # port (it is published on 127.0.0.1 only), so the peer is always the Docker
    # bridge gateway; a public client can never be trusted to assert its own IP.
    #
    # real_ip_recursive is OFF deliberately: nginx then takes the LAST entry of
    # X-Forwarded-For, which is the address the terminator itself observed. A
    # client that pre-sets the header only prepends to it, so a spoofed value is
    # never the one selected.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive off;

    # ------------------------------------------------------------ rate limit
    limit_req_zone  $binary_remote_addr zone=global:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=authz:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=wagerz:10m rate=1r/s;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=conns:10m;
    limit_conn_status 429;

    # -------------------------------------------------------------- request id
    # Reuse a caller-supplied id when present so a trace spans the whole hop;
    # services re-validate it before it reaches a log line.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ------------------------------------------------------------------ CORS
    # Explicit allowlist. NEVER '*' — the API uses credentials, and '*' is both
    # invalid with credentials and an open door for any origin.
    map $http_origin $cors_origin {
        default "";
        "~*^(${ALLOWED_ORIGINS_REGEX})$" $http_origin;
    }
    # Each of these collapses to "" for a disallowed origin, and nginx omits an
    # add_header whose value is empty.
    map $cors_origin $cors_credentials {
        ""      "";
        default "true";
    }
    map $cors_origin $cors_methods {
        ""      "";
        default "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    }
    map $cors_origin $cors_allow_headers {
        ""      "";
        default "Authorization, Content-Type, X-Request-Id";
    }
    map $cors_origin $cors_expose_headers {
        ""      "";
        default "X-Request-Id, RateLimit-Limit, RateLimit-Remaining, Retry-After";
    }
    map $cors_origin $cors_max_age {
        ""      "";
        default "600";
    }

    # ------------------------------------------------------------- websocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ------------------------------------------------------ forwarded scheme
    # This gateway terminates no TLS. In production it sits behind something
    # that does (load balancer / ingress / Cloudflare), so $scheme here is
    # always "http" and would tell every upstream that the user's connection
    # was insecure. Honour an inbound X-Forwarded-Proto when present and fall
    # back to $scheme for direct local access.
    #
    # This is only safe because nothing but the TLS terminator can reach this
    # port. If the container is ever exposed directly, a client could assert
    # "https" — which is why TRUST_PROXY_HOPS is 1 and not larger.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ---------------------------------------------------------------- logging
    log_format json_access escape=json
        '{"ts":"$time_iso8601","level":"info","msg":"gateway_request",'
        '"service":"gateway","request_id":"$req_id","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","ip":"$remote_addr"}';
    # $uri, not $request_uri: query strings can carry user data.
    access_log /var/log/nginx/access.log json_access;

    # -------------------------------------------------------------- upstreams
    upstream auth_upstream    { server auth:4001      max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream profile_upstream { server profile:4002   max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream game_upstream    { server game:4003      max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream wager_upstream   { server wager:4004     max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream rpc_upstream     { server rpc-proxy:4005 max_fails=3 fail_timeout=10s; keepalive 16; }

    server {
        listen 8080;
        listen [::]:8080;
        # Production hostname first, then the local names, then `_` so this
        # stays the default server and `curl localhost:8080` keeps working.
        # TLS is terminated upstream of this container — see X-Forwarded-Proto
        # above. Do not add ssl_certificate here.
        server_name api.ocva.online localhost 127.0.0.1 _;

        limit_conn conns 64;

        # ------------------------------------------------------------ headers
        # Declared once at server level. add_header inside a location REPLACES
        # the inherited set, so no location below adds headers of its own.
        add_header X-Content-Type-Options    "nosniff"                   always;
        add_header X-Frame-Options           "DENY"                      always;
        add_header Referrer-Policy           "no-referrer"               always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"            always;
        add_header Cross-Origin-Resource-Policy "same-origin"            always;
        add_header X-Request-Id              $req_id                     always;
        # Enable once TLS terminates here rather than at a load balancer:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # H-9: no third-party script hosts. PeerJS, model-viewer and Google
        # Fonts must be self-hosted or dropped; nothing here permits a CDN.
        # 'unsafe-inline' is granted to style-src only (the React app uses
        # inline style attributes) and never to script-src.
        #
        # Must stay on ONE line: a backslash-newline inside an nginx quoted
        # string keeps the newline, and a header value cannot contain one.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'" always;

        add_header Vary                             "Origin"               always;
        add_header Access-Control-Allow-Origin      $cors_origin           always;
        add_header Access-Control-Allow-Credentials $cors_credentials      always;
        add_header Access-Control-Allow-Methods     $cors_methods          always;
        add_header Access-Control-Allow-Headers     $cors_allow_headers    always;
        add_header Access-Control-Expose-Headers    $cors_expose_headers   always;
        add_header Access-Control-Max-Age           $cors_max_age          always;

        # Preflight never reaches an upstream.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ------------------------------------------------------- proxy defaults
        # Inherited by every location below.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id      $req_id;
        proxy_set_header Connection        "";
        # Identity is carried ONLY by the Bearer token. Clear any header a
        # client might send hoping an upstream trusts it (C-3).
        proxy_set_header X-Profile-Id      "";
        proxy_set_header X-Auth-Roles      "";
        proxy_set_header X-Operator        "";
        proxy_set_header X-Admin-Token     "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        # Upstream error envelopes are already correct JSON — pass them through.
        proxy_intercept_errors off;

        # Services set these too, so that running one directly (without the
        # gateway) is still safe. Drop the upstream copy here so the client
        # receives exactly one of each — duplicated security headers are at
        # best noise and at worst parsed inconsistently.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Request-Id;

        # ------------------------------------------------------------ routing

        # auth :4001 — path is preserved, the service mounts /auth/*
        location /auth/ {
            limit_req zone=authz  burst=10 nodelay;
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://auth_upstream;
        }

        # profile :4002
        location /api/ {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://profile_upstream;
        }

        # game :4003
        location /games/ {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://game_upstream;
        }

        # game :4003 — websocket. Must precede no other rule; kept separate so
        # the upgrade headers and long read timeout apply only here.
        location /socket.io/ {
            limit_req zone=global burst=40 nodelay;
            proxy_pass http://game_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering off;
        }

        # wager :4004
        #
        # There was a /wager/shipping location here granting a 1 MB body. No
        # such route exists: the shipping form is
        # POST /wager/boosters/tickets/:ticketNumber/shipping, which the prefix
        # below already covers, and a postal address fits in 256 KB. An unused
        # location that relaxes the body cap is a hole with no upside, so it is
        # gone and every /wager/ route now shares the global 256 KB limit.
        location /wager/ {
            limit_req zone=wagerz burst=5 nodelay;
            proxy_pass http://wager_upstream;
        }

        # rpc-proxy :4005 — holds the real API keys so the browser bundle
        # never does (H-5).
        location /rpc/ {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://rpc_upstream;
        }

        # Gateway's own liveness. Not proxied.
        location = /healthz {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ------------------------------------------------------- default 404
        location / {
            limit_req zone=global burst=20 nodelay;
            return 404 '{"error":{"code":"not_found","message":"Route not found"}}';
        }

        # --------------------------------------- gateway-generated error pages
        # Same envelope shape as the services, so a client has one parser.
        error_page 400 = @bad_request;
        error_page 405 = @method_not_allowed;
        error_page 408 = @timeout;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        error_page 500 501 = @internal;
        error_page 502 503 504 = @upstream_unavailable;

        location @bad_request {
            return 400 '{"error":{"code":"bad_request","message":"Malformed request"}}';
        }
        location @method_not_allowed {
            return 405 '{"error":{"code":"method_not_allowed","message":"Method not allowed"}}';
        }
        location @timeout {
            return 408 '{"error":{"code":"bad_request","message":"Request timed out"}}';
        }
        location @too_large {
            return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds the 256 KB limit"}}';
        }
        location @rate_limited {
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests"}}';
        }
        location @internal {
            return 500 '{"error":{"code":"internal","message":"Internal server error"}}';
        }
        location @upstream_unavailable {
            return 503 '{"error":{"code":"unavailable","message":"Service temporarily unavailable"}}';
        }
    }
}
