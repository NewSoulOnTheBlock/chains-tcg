[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./"}]

# Robinhood Chain (EVM L2, Arbitrum Orbit) — chain id 4663.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC}"

[etherscan]
# Fill in if Robinhood Chain exposes a block-explorer verify API.
robinhood = { key = "${EXPLORER_API_KEY}", chain = 4663 }
