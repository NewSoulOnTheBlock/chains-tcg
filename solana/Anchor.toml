[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
master_wager = "9JnG7C3uBVnMgx5tSAxSb9ccSuwCC4LkmyV26goXe1pC"

[programs.devnet]
master_wager = "9JnG7C3uBVnMgx5tSAxSb9ccSuwCC4LkmyV26goXe1pC"

[programs.mainnet]
master_wager = "9JnG7C3uBVnMgx5tSAxSb9ccSuwCC4LkmyV26goXe1pC"

[registry]
url = "https://api.apr.dev"

# Default to localnet so `anchor test` / `anchor deploy` / `anchor migrate` never touch
# mainnet by accident (contracts-18). Target mainnet EXPLICITLY, e.g.:
#   anchor deploy --provider.cluster mainnet
[provider]
cluster = "localnet"
wallet = '~\.config\solana\id.json'

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

