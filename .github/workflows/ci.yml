name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: Front end (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: new-backend (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-backend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: new-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
