    <!-- Social card: a 1200x630 JPEG derived from public/login-splash.png
         (1681x936, 2.1 MB). Several scrapers silently skip images over ~1 MB,
         so the shipped card is a compressed 1.91:1 crop instead of the raw
         splash. Regenerate with:
           sips --resampleWidth 1200 public/login-splash.png --out /tmp/a.png
           sips -c 630 1200 /tmp/a.png --out /tmp/b.png
           sips -s format jpeg -s formatOptions 82 /tmp/b.png --out public/og-image.jpg -->
    <meta property="og:image" content="https://ocva.online/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The On-Chain Virtual Arena logotype above a glowing violet arena floor, flanked by Ethereum, BNB, Solana and Robinhood card backs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="/favicon.png?v=2" />

    <!-- Fonts + global base styles are self-hosted and imported from
         src/index.tsx (see src/fonts.css and src/base.css). Nothing here may
         reference a third-party origin: the gateway serves
         `default-src 'self'; script-src 'self'`. -->
    <!-- The two faces that paint on first frame: Inter (body) and Cinzel
         (every heading). The latin-ext siblings load on demand via
         unicode-range, so they are deliberately not preloaded. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
